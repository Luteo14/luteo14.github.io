<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mes objectifs | LUTEO14 SPORT</title><link rel="stylesheet" href="/sport/assets/sport-unified.css?v=4.4.0"></head><body><header class="sport-page-hero"><p class="eyebrow">OBJECTIFS & COMPÉTITIONS</p><h1>Mes objectifs sportifs</h1><p>Prépare, suis et analyse tes compétitions dans un espace dédié, synchronisable entre tes appareils.</p></header><main class="objectives-shell"><div class="objective-actions"><button class="sport-unified-button" id="addObjective" type="button">+ Ajouter un objectif</button><button class="sport-unified-button secondary" id="syncObjectives" type="button">Synchroniser mes objectifs</button><span class="cloud-state" id="cloudState">Prêt.</span></div><div class="objectives-grid"><aside class="objective-list"><h2>Calendrier</h2><div id="objectiveList"></div></aside><section><div class="objective-detail" id="objectiveDetail"><p class="muted">Sélectionne ou ajoute une compétition.</p></div><form class="objective-form" id="objectiveForm" hidden><h2 id="formTitle">Nouvel objectif</h2><div class="fields"><label>Nom *<input name="name" maxlength="100" required></label><label>Date *<input name="date" type="date" required></label><label>Distance *<select name="distance"><option value="5">5 km</option><option value="10">10 km</option><option value="21.0975">Semi-marathon</option><option value="42.195">Marathon</option><option value="0">Autre</option></select></label><label>Distance personnalisée (km)<input name="customDistance" type="number" min="0.1" max="500" step="0.001"></label><label>Objectif chrono *<input name="goal" placeholder="03:35:00" pattern="[0-9]{1,3}:[0-5][0-9]:[0-5][0-9]" required></label><label>Volume cible (km/semaine)<input name="weeklyKm" type="number" min="0" max="300" step="0.5" required></label><label>Lieu<input name="place" maxlength="100"></label><label>Résultat<input name="result" placeholder="03:34:15" pattern="[0-9]{1,3}:[0-5][0-9]:[0-5][0-9]"></label><label>URL activité Strava<input name="stravaUrl" type="url" placeholder="https://www.strava.com/activities/..."></label><label class="full">Bilan / sensations<textarea name="notes" maxlength="3000" rows="4"></textarea></label></div><div class="objective-actions"><button class="sport-unified-button" type="submit">Enregistrer</button><button class="sport-unified-button secondary" id="cancelObjective" type="button">Annuler</button></div></form></section></div></main><script src="objectifs.js?v=4.4.0"></script><script src="/sport/js/common-nav.js?v=4.4.0"></script><script defer src="/assets/version.js"></script></body></html>
